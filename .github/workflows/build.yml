name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          # Tìm file .app trong repo và copy vào thư mục Payload
          APP_PATH=$(find . -maxdepth 3 -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r output.ipa Payload
            echo "Đã đóng gói thành công file output.ipa từ $APP_PATH"
          else
            echo "Khong tim thấy file .app trong kho lưu trữ!"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: output.ipa
